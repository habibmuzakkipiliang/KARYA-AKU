<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Website Sederhana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-lg" style="width: 100%; max-width: 420px;">
            <div class="card-body p-5">
                <h2 class="text-center mb-4 fw-bold">Daftar</h2>
                <form>
                    <div class="mb-4">
                        <label for="name" class="form-label fw-medium">Nama Lengkap</label>
                        <input type="text" class="form-control form-control-lg" id="name" placeholder="Masukkan nama lengkap" required>
                    </div>
                    <div class="mb-4">
                        <label for="email" class="form-label fw-medium">Email</label>
                        <input type="email" class="form-control form-control-lg" id="email" placeholder="email@contoh.com" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-medium">Password</label>
                        <input type="password" class="form-control form-control-lg" id="password" placeholder="Buat password" required>
                    </div>
                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label fw-medium">Konfirmasi Password</label>
                        <input type="password" class="form-control form-control-lg" id="confirmPassword" placeholder="Konfirmasi password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-4">Daftar</button>
                    <div class="text-center">
                        <p class="mb-0">Sudah punya akun? <a href="index.html" class="text-primary fw-medium">Masuk</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
